bus_route:
  code: 3-01
  name: 버스 노선 정보
  category: 교통
  exportable: true
  source: 제주빅데이터센터/제주데이터허브
  description: "- 제주특별자치도 버스 노선 정보를 제공합니다. \n  - 본 데이터는 일일 기준으로 누적 업데이트되어 변경이력을 확인할 수 있습니다."
  columns:
  - name: serial_number
    kor: 일련번호
    type: STRING
    example: '1'
    note: base_date 기준 일련번호 (7자리)
  - name: base_date
    kor: 날짜
    type: STRING
    example: '20180701'
    note: 수집일자 (YYYYMMDD)
  - name: pt_year
    kor: 년
    type: STRING
    example: '2018'
    note: 파티션 컬럼 (SQL 검색시 검색조건)
  - name: pt_month
    kor: 월
    type: STRING
    example: '7'
    note: 파티션 컬럼 (SQL 검색시 검색조건)
  - name: bus_route_id
    kor: 버스 노선 아이디
    type: STRING
    example: '10000'
    note: 버스 노선 아이디 (8자리)
  - name: bus_route_number
    kor: 버스 노선 번호
    type: STRING
    example: 2-1
    note: 버스 노선 번호
  - name: bus_route_name
    kor: 버스 노선명
    type: STRING
    example: 2-1(월평마을~월평마을)
    note: 버스 노선 한글명
  - name: start_date
    kor: 시작일
    type: STRING
    example: '20150729'
    note: 버스 노선 운행 시작일자 (YYYYMMDD)
  - name: bus_station_count
    kor: 버스 정류소 수
    type: INT
    example: '55'
    note: 버스 노선에 속하는 정류소 수
  - name: bus_route_length
    kor: 버스 노선거리
    type: INT
    example: '5763'
    note: 운행 거리 기준 (m)
  - name: bus_transferability
    kor: 환승가능여부
    type: STRING
    example: Y
    note: Y 환승가능, N 환승불가능
bus_route_usage:
  code: 3-02
  name: 버스 노선별 이용 현황
  category: 교통
  exportable: true
  source: 제주빅데이터센터/제주데이터허브
  description: "- 제주특별자치도 버스 노선별 이용 현황을 시간단위로 제공합니다. \n  - (주)티머니 수집 데이터로 티머니카드 태그 기반의 이용 현황입니다.\n  - 본 데이터는 일일 기준으로 누적 업데이트 됩니다."
  columns:
  - name: base_date
    kor: 날짜
    type: STRING
    example: '20180701'
    note: 수집일자 (YYYYMMDD)
  - name: pt_year
    kor: 년
    type: STRING
    example: '2018'
    note: 파티션 컬럼 (SQL 검색시 검색조건)
  - name: pt_month
    kor: 월
    type: STRING
    example: '7'
    note: 파티션 컬럼 (SQL 검색시 검색조건)
  - name: day_of_week
    kor: 요일
    type: STRING
    example: 월
    note: 월~일요일
  - name: base_hour
    kor: 시간대
    type: STRING
    example: '1'
    note: 00 ~ 23
  - name: bus_route_id
    kor: 버스 노선 아이디
    type: STRING
    example: '21270000'
    note: 버스 노선 아이디 (8자리)
  - name: bus_route_name
    kor: 버스 노선명
    type: STRING
    example: 111-2(성산항~제주국제공항)
    note: 버스 노선 한글명
  - name: get_on_off_type
    kor: 승하차유형
    type: STRING
    example: 승차
    note: 승차, 환승
  - name: user_category
    kor: 이용자구분
    type: STRING
    example: 일반
    note: 어린이, 청소년, 일반, 경로, 장애 일반/동반, 유공 일반/동반
  - name: pay_type
    kor: 결제유형
    type: STRING
    example: 카드
    note: 카드
  - name: user_count
    kor: 이용자수
    type: INT
    example: '1'
    note: 버스 카드 이용자 수 (명)
